# TIP-Guard, every component enabled. Mock models so the whole suite runs
# offline and in CI; real-model variants are selected by the experiments plan.
name: tipguard-full
seed: 0
dataset: data/generated/tipguard-v1.jsonl
main_model: mock-main
defense:
  name: tip_guard
  params:
    canonicalizer_model: mock-judge
    classifier_model: mock-judge
    rule: max
    threshold: 0.5
output_dir: reports/runs
cache_dir: .tipguard-cache
